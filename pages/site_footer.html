<footer class="site-footer">
    <div class="wrap footer-grid">
        <div class="footer-brand">
            <a href="{{ url_for('home') }}" class="footer-logo"><img src="{{ url_for('static', filename='images/logo-128.png') }}" alt="" width="56" height="56" loading="lazy"><span>BuildBetter</span></a>
        </div>
        <nav aria-labelledby="footer-shop">
            <h2 id="footer-shop">Shop</h2>
            <ul>
                <li><a href="{{ url_for('products.products') }}">Products</a></li>
                <li><a href="{{ url_for('products.heavy_machinery') }}">Heavy Machinery</a></li>
                <li><a href="{{ url_for('crews.crews') }}">Crews</a></li>
                <li><a href="{{ url_for('shopping.show_cart') }}">Cart</a></li>
            </ul>
        </nav>
        <nav aria-labelledby="footer-plan">
            <h2 id="footer-plan">Plan</h2>
            <ul>
                <li><a href="{{ url_for('planner.planner') }}">AI Planner</a></li>
                <li><a href="{{ url_for('dashboard.projects') }}">Saved Projects</a></li>
            </ul>
        </nav>
        <nav aria-labelledby="footer-account">
            <h2 id="footer-account">Account</h2>
            <ul>
                {% if session.get("user_id") %}
                    <li><a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a></li>
                    <li><a href="{{ url_for('subscription.manage_subscription') }}">Subscription</a></li>
                    <li><a href="{{ url_for('dashboard.settings') }}">Settings</a></li>
                    <li>
                        <form method="post" action="{{ url_for('auth.logout') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit">Log out</button>
                        </form>
                    </li>
                {% else %}
                    <li><a href="{{ url_for('auth.login') }}">Log in</a></li>
                    <li><a href="{{ url_for('auth.register') }}">Create an account</a></li>
                {% endif %}
            </ul>
        </nav>
    </div>
    <div class="wrap footer-base">
        <p>&copy; BuildBetter</p>
    </div>
</footer>
