{% extends "base.html" %}

{% block title %}
Register - BuildBetter
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='forms.css') }}">
{% endblock %}

{% block underConstruction %}
{% endblock %}

{% block content %}
<div class="form-container">
    <form id="register-form" class="account-form" method="post" action="{{ url_for('auth.register') }}">
        <h2>Create Account</h2>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="JohnDoe123" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="JD@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>

        <p id="register-message" role="alert"></p>
        <button type="submit">Register</button>
    </form>
</div>

<script
    src="{{ url_for('static', filename='js/register.js') }}"
    type="module"
></script>
{% endblock %}
