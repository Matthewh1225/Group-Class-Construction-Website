<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BuildBetter{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    {% block styles %}
    {% endblock %}
</head>


<body>
    {% block underConstruction %}
    <img
        src="{{ url_for('static', filename='images/underConstruction.png') }}"
        alt="BuildBetter"
    >
    {% endblock %}
        <nav class="navbar">
            <a href="/home" class="navbar-brand"> <img src="{{ url_for('static', filename='images/logo.png') }}"> </a>
            <a href="/products">Products</a>
            <a href="/planner">AI Planner</a>
            <a href="/dashboard">Dashboard</a>
            {% if session.get("user_id") %}
            <form class="nav-session" method="post" action="{{ url_for('auth.logout') }}">
                <button type="submit">Logout</button>
            </form>
            {% else %}
            <a class="nav-session" href="{{ url_for('auth.login') }}">Login</a>
            {% endif %}
        </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
