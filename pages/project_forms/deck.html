<section
    id="deck-questions-step"
    class="planner-step template-questions"
    {% if project_mode != "template" or project_template != "deck" %}hidden{% endif %}
>
    <button class="template-back step-back" type="button">&larr; All templates</button>
    <h2 tabindex="-1">Outdoor deck details</h2>
    <form method="post" action="{{ url_for('planner.submit_planning_job') }}">
        <input type="hidden" name="projectMode" value="template">
        <input type="hidden" name="projectTemplate" value="{{ template_id }}">
        <fieldset class="field-group">
            <legend>Dimensions</legend>
            <div class="field-row">
                <div class="form-field">
                    <label for="deck-length">Length <span class="sr-only">in feet</span></label>
                    <div class="unit-input">
                        <input id="deck-length" name="lengthFt" type="number" inputmode="numeric" min="1" step="1" value="{{ form_data.get('lengthFt', '') }}" required>
                        <span aria-hidden="true">ft</span>
                    </div>
                </div>
                <div class="form-field">
                    <label for="deck-width">Width <span class="sr-only">in feet</span></label>
                    <div class="unit-input">
                        <input id="deck-width" name="widthFt" type="number" inputmode="numeric" min="1" step="1" value="{{ form_data.get('widthFt', '') }}" required>
                        <span aria-hidden="true">ft</span>
                    </div>
                </div>
                <div class="form-field">
                    <label for="deck-height">Height above ground <span class="sr-only">in feet</span></label>
                    <div class="unit-input">
                        <input id="deck-height" name="heightFt" type="number" inputmode="numeric" min="0" step="1" value="{{ form_data.get('heightFt', '') }}" required>
                        <span aria-hidden="true">ft</span>
                    </div>
                </div>
            </div>
        </fieldset>
        <div class="choice-grid">
            <fieldset class="choice-group">
                <legend>Decking material</legend>
                <div class="choice-buttons">
                    <label><input type="radio" name="decking" value="pressure-treated wood" {% if form_data.get('decking') == 'pressure-treated wood' %}checked{% endif %} required><span>Pressure-treated</span></label>
                    <label><input type="radio" name="decking" value="cedar" {% if form_data.get('decking') == 'cedar' %}checked{% endif %}><span>Cedar</span></label>
                </div>
            </fieldset>
            {% for name, question in [('railing', 'Railing'), ('stairs', 'Stairs')] %}
                <fieldset class="choice-group">
                    <legend>{{ question }}</legend>
                    <div class="choice-buttons">
                        <label><input type="radio" name="{{ name }}" value="yes" {% if form_data.get(name) == 'yes' %}checked{% endif %} required><span>Yes</span></label>
                        <label><input type="radio" name="{{ name }}" value="no" {% if form_data.get(name) == 'no' %}checked{% endif %}><span>No</span></label>
                    </div>
                </fieldset>
            {% endfor %}
        </div>
        <div class="form-field">
            <label for="deck-description">Additional description <span class="optional">(optional)</span></label>
            <textarea id="deck-description" class="planner-input" name="userInput"
                      placeholder="Describe the location or special requirements...">{{ form_data.get('userInput', '') }}</textarea>
        </div>
        {% include "project_forms/plan_buttons.html" %}
    </form>
</section>
