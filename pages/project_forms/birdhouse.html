<section
    id="birdhouse-questions-step"
    class="planner-step template-questions"
    {% if project_mode != "template" or project_template != "birdhouse" %}hidden{% endif %}
>
    <button class="template-back step-back" type="button">&larr; All templates</button>
    <h2 tabindex="-1">Birdhouse details</h2>
    <form method="post" action="{{ url_for('planner.submit_planning_job') }}">
        <input type="hidden" name="projectMode" value="template">
        <input type="hidden" name="projectTemplate" value="{{ template_id }}">
        <fieldset class="field-group">
            <legend>Dimensions</legend>
            <div class="field-row">
                {% for field_id, name, label in [('birdhouse-width', 'widthInches', 'Width'), ('birdhouse-depth', 'depthInches', 'Depth'), ('birdhouse-height', 'heightInches', 'Height')] %}
                    <div class="form-field">
                        <label for="{{ field_id }}">{{ label }} <span class="sr-only">in inches</span></label>
                        <div class="unit-input">
                            <input id="{{ field_id }}" name="{{ name }}" type="number" inputmode="decimal" min="1" step="0.25" value="{{ form_data.get(name, '') }}" required>
                            <span aria-hidden="true">in</span>
                        </div>
                    </div>
                {% endfor %}
                <div class="form-field">
                    <label for="birdhouse-hole-size">Entrance hole <span class="sr-only">diameter in inches</span></label>
                    <div class="unit-input">
                        <input id="birdhouse-hole-size" name="entranceHoleInches" type="number" inputmode="decimal" min="0.5" step="0.125" value="{{ form_data.get('entranceHoleInches', '') }}" required>
                        <span aria-hidden="true">in &oslash;</span>
                    </div>
                </div>
            </div>
        </fieldset>
        <div class="choice-grid">
            <fieldset class="choice-group">
                <legend>Include a perch?</legend>
                <div class="choice-buttons">
                    <label><input type="radio" name="perch" value="yes" {% if form_data.get('perch') == 'yes' %}checked{% endif %} required><span>Yes</span></label>
                    <label><input type="radio" name="perch" value="no" {% if form_data.get('perch') == 'no' %}checked{% endif %}><span>No</span></label>
                </div>
            </fieldset>
            <div class="form-field">
                <label for="birdhouse-color">Color</label>
                <input id="birdhouse-color" name="color" type="text" value="{{ form_data.get('color', '') }}" placeholder="Natural, blue, red..." required>
            </div>
        </div>
        <div class="form-field">
            <label for="birdhouse-description">Describe the birdhouse</label>
            <textarea id="birdhouse-description" class="planner-input" name="userInput" required>{{ form_data.get('userInput', 'I want to build a wooden birdhouse.') }}</textarea>
        </div>
        {% include "project_forms/plan_buttons.html" %}
    </form>
</section>
