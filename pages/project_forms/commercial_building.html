<section
    id="commercial_building-questions-step"
    class="planner-step template-questions"
    {% if project_mode != "template" or project_template != "commercial_building" %}hidden{% endif %}
>
    <button class="template-back step-back" type="button">&larr; All templates</button>
    <h2 tabindex="-1">Commercial building details</h2>
    <form method="post" action="{{ url_for('planner.submit_planning_job') }}">
        <input type="hidden" name="projectMode" value="template">
        <input type="hidden" name="projectTemplate" value="{{ template_id }}">
        <fieldset class="field-group">
            <legend>Layout</legend>
            <div class="field-row">
                <div class="form-field">
                    <label for="commercial-footprint">Footprint <span class="sr-only">in square feet</span></label>
                    <div class="unit-input">
                        <input id="commercial-footprint" name="footprintSqFt" type="number" inputmode="numeric" min="1" step="1" value="{{ form_data.get('footprintSqFt', '') }}" required>
                        <span aria-hidden="true">sq ft</span>
                    </div>
                </div>
                <div class="form-field">
                    <label for="commercial-floors">Floors</label>
                    <input id="commercial-floors" name="floors" type="number" inputmode="numeric" min="1" step="1" value="{{ form_data.get('floors', '') }}" required>
                </div>
                <div class="form-field">
                    <label for="commercial-rooms">Rooms</label>
                    <input id="commercial-rooms" name="rooms" type="number" inputmode="numeric" min="1" step="1" value="{{ form_data.get('rooms', '') }}" required>
                </div>
                <fieldset class="choice-group">
                    <legend>Elevator</legend>
                    <div class="choice-buttons">
                        <label><input type="radio" name="elevator" value="yes" {% if form_data.get('elevator') == 'yes' %}checked{% endif %} required><span>Yes</span></label>
                        <label><input type="radio" name="elevator" value="no" {% if form_data.get('elevator') == 'no' %}checked{% endif %}><span>No</span></label>
                    </div>
                </fieldset>
            </div>
        </fieldset>
        <div class="form-field">
            <label for="commercial-description">Additional description <span class="optional">(optional)</span></label>
            <textarea id="commercial-description" class="planner-input" name="userInput" placeholder="Use, number of tenants, finishes...">{{ form_data.get('userInput', '') }}</textarea>
        </div>
        {% include "project_forms/plan_buttons.html" %}
    </form>
</section>
