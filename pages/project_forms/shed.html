<fieldset class="field-group">
    <legend>Size</legend>
    <div class="field-row">
        {{ number_field('lengthFt', 'Length', unit='ft') }}
        {{ number_field('widthFt', 'Width', unit='ft') }}
    </div>
</fieldset>
<fieldset class="field-group">
    <legend>A couple of details</legend>
    <div class="field-row">
        {{ number_field('heightFt', 'Wall height', default=8, unit='ft', required=False) }}
    </div>
    <div class="choice-grid">
        {{ checkbox('window', 'Include a window') }}
    </div>
</fieldset>
