<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="submissionKey" value="{{ submission_key }}">
<fieldset class="planner-tiers">
    <legend>AI planning mode</legend>
    <div class="planner-tier-options">
        {% for tier_id, tier in workflow_tiers.items() %}
            <label class="planner-tier">
                <input type="radio" name="planType" value="{{ tier_id }}" {% if form_data.get('planType', 'fast') == tier_id %}checked{% endif %} {% if tier_id == 'pro' and not pro_allowed %}disabled{% endif %} required>
                <span class="tier-content">
                    <strong>{{ tier.label }}</strong>
                    {% if tier_id == 'pro' and not pro_allowed %}
                        <small class="tier-locked">Pro subscription needed. <a href="{{ url_for('subscription.subscribe') }}">Subscribe</a></small>
                    {% endif %}
                </span>
            </label>
        {% endfor %}
    </div>
</fieldset>
<div class="planner-submit-row">
    <button class="planner-generate" type="submit">Generate estimate <span aria-hidden="true">&rarr;</span></button>
    {% if not pro_allowed %}
        <aside class="planner-pro" aria-label="Quantum Ultra Deep Pro Max+">
            <div>
                <h3>Quantum Ultra Deep Pro Max+</h3>
            </div>
            <div class="planner-pro-actions">
                {% if session.get("user_id") %}
                    <a class="btn btn-ghost" href="{{ url_for('subscription.subscribe') }}">Upgrade to Pro</a>
                {% else %}
                    <a class="btn btn-ghost" href="{{ url_for('auth.register') }}">Create a free account</a>
                {% endif %}
                <a class="text-link" href="{{ url_for('subscription.about_pro') }}">What Pro includes</a>
            </div>
        </aside>
    {% endif %}
</div>
<p class="plan-status" role="status" aria-live="polite" hidden></p>
