{% extends "auth_layout.html" %}

{% block title %}
    Log in - BuildBetter
{% endblock %}

{% block sheet_number %}G-01{% endblock %}

{% block auth_intro %}
    <p class="sheet-tag"><span>G-01</span>Sign in</p>
    <h1>Back to the drawing board.</h1>
{% endblock %}

{% block auth_form %}
    <form id="login-form" class="account-form" method="post" action="{{ url_for('auth.login') }}">
        <h2>Log in</h2>
        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" maxlength="100" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <button class="password-toggle" type="button" aria-controls="password" aria-pressed="false" hidden>Show</button>
            </div>
        </div>
        <p id="login-message" class="form-message" role="alert"></p>
        <button class="btn btn-primary" type="submit" data-busy-label="Logging in&hellip;">Log in <span class="arrow" aria-hidden="true">&rarr;</span></button>
        <p class="auth-switch">New to BuildBetter? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </form>
    <script src="{{ url_for('static', filename='js/login.js') }}" type="module"></script>
{% endblock %}
